name: SwimInstructor
options:
  bundleIdPrefix: com.kellner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # Texte im Code sind deutsch (zugleich die Schlüssel), Englisch ist die Rückfallsprache für iPhones in anderen
  # Sprachen. Übersetzungen: Localization/<Sprache>.lproj, siehe docs/uebersetzungen.md.
  developmentLanguage: en

settings:
  base:
    # Name unter dem Symbol auf iPhone und Watch und in den Health-Hinweisen (beide Info.plist). Bundle-IDs, Targets und
    # das Repo heißen weiter SwimInstructor, damit TestFlight, Health-Freigaben und gespeicherte Daten bleiben.
    APP_DISPLAY_NAME: Peaksmith

packages:
  SwimInstructorCore:
    path: Packages/SwimInstructorCore

targets:
  SwimInstructor:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Localization
    dependencies:
      - package: SwimInstructorCore
      - target: SwimInstructorWatch
        embed: true
        codeSignOnCopy: true
      - target: SwimInstructorWidgets
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SwimInstructor.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # Automatic for local Simulator/device debugging (⌘R) - convenient, no profile needed.
          CODE_SIGN_STYLE: Automatic
        Release:
          # Manual with the match App Store profile for Archive - survives every `xcodegen
          # generate` re-run, unlike a manual Xcode GUI signing override, which gets wiped out
          # every time the project is regenerated.
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # The exact current profile name - match appends a number when a profile gets
          # regenerated under a cert renewal, so the plain "match AppStore <bundle id>" string
          # can go stale and silently match a leftover profile tied to an old, revoked cert.
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.kellner.SwimInstructor 1790706585"

  SwimInstructorWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Localization
    dependencies:
      - package: SwimInstructorCore
      - target: SwimInstructorWatchWidgets
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SwimInstructorWatch.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Embedded in the iOS app via `embed: true` - must NOT also be installed as a standalone
        # product, otherwise the archive contains two top-level apps, Xcode classifies it as a
        # "Generic Xcode Archive" and offers no distribution methods (exportArchive then fails
        # with `expected one {}` - an empty list of valid methods).
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.kellner.SwimInstructor.watchkitapp 1790706588"

  # Widget auf Home- und Sperrbildschirm: die nächste Einheit aus der App-Gruppe (PlanGlanceStore).
  SwimInstructorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: WidgetsShared
      - path: Shared/Theme.swift
      - path: Localization
    dependencies:
      - package: SwimInstructorCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          # Profilname setzt die beta-Lane (update_code_signing_settings) aus match.
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"

  # Komplikation auf dem Zifferblatt, im Watch-App-Bundle.
  SwimInstructorWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: WidgetsShared
      - path: Shared/Theme.swift
      - path: Localization
    dependencies:
      - package: SwimInstructorCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor.watchkitapp.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/WatchWidgets.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"
