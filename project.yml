name: SwimInstructor
options:
  bundleIdPrefix: com.steffenkellner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  SwimInstructorCore:
    path: Packages/SwimInstructorCore

targets:
  SwimInstructor:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SwimInstructorCore
      - target: SwimInstructorWatch
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffenkellner.SwimInstructor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SwimInstructor.entitlements
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - SwimInstructorCoreTests

  SwimInstructorWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: SwimInstructorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffenkellner.SwimInstructor.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SwimInstructorWatch.entitlements
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
