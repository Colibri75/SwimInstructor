name: SwimApp
options:
  bundleIdPrefix: com.steffenkellner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  SwimAppCore:
    path: Packages/SwimAppCore

targets:
  SwimApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SwimAppCore
      - target: SwimAppWatch
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffenkellner.SwimApp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SwimApp.entitlements
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - SwimAppCoreTests

  SwimAppWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: SwimAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steffenkellner.SwimApp.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SwimAppWatch.entitlements
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
