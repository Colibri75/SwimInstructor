name: SwimInstructor
options:
  bundleIdPrefix: com.kellner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  SwimInstructorCore:
    path: Packages/SwimInstructorCore

targets:
  SwimInstructor:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SwimInstructorCore
      - target: SwimInstructorWatch
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SwimInstructor.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # Automatic for local Simulator/device debugging (⌘R) - convenient, no profile needed.
          CODE_SIGN_STYLE: Automatic
        Release:
          # Manual with the match App Store profile for Archive - survives every `xcodegen
          # generate` re-run, unlike a manual Xcode GUI signing override, which gets wiped out
          # every time the project is regenerated.
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.kellner.SwimInstructor"

  SwimInstructorWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: SwimInstructorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellner.SwimInstructor.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SwimInstructorWatch.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TTLJUNRA3R
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.kellner.SwimInstructor.watchkitapp"
