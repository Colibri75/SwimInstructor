name: Backend CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit- und Integrationstests (inkl. Coverage-Schwelle)
        run: npm test

      - name: Auf bekannte Schwachstellen pruefen (nur Produktions-Abhaengigkeiten)
        run: npm audit --omit=dev --audit-level=high

  # Stellt das Deployment auf dem Server nach: gleiche compose.yaml, gleicher Pfad fuer die
  # Konfigurationsdatei. Faengt Fehler in Dockerfile, Compose-Datei und Healthcheck ab.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Konfigurationsdatei wie auf dem Server anlegen
        run: |
          sudo mkdir -p /etc/swiminstructor
          echo "API_TOKEN=ci-token-$(openssl rand -hex 24)" | sudo tee /etc/swiminstructor/backend.env >/dev/null
          sudo chmod 600 /etc/swiminstructor/backend.env

      - name: Image bauen und Container starten
        working-directory: backend
        run: docker compose up -d --build

      - name: Warten, bis der Container gesund ist
        run: |
          for _ in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' swiminstructor-backend)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Container wurde nicht gesund (Status: $status)"
          exit 1

      - name: Smoke-Test gegen den laufenden Container
        run: |
          curl -fsS http://127.0.0.1:3100/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/v1/status)" = "401"
          TOKEN=$(sudo grep '^API_TOKEN=' /etc/swiminstructor/backend.env | cut -d= -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3100/v1/status)" = "200"
          test "$(docker exec swiminstructor-backend id -u)" != "0"
          echo "Smoke-Test ok: Health 200, ohne Token 401, mit Token 200, Container laeuft nicht als root"

      - name: Container-Logs
        if: failure()
        run: docker logs swiminstructor-backend || true

      - name: Aufraeumen
        if: always()
        run: docker compose -f backend/compose.yaml down || true
