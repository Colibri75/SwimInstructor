name: iOS CI/CD

# Backend, Doku und Markdown loesen keinen (teuren) macOS-Lauf und keinen TestFlight-Build aus.
# Arbeits-Branches laufen nur ueber ihren PR, nicht zusaetzlich bei jedem Push: Das sparte im privaten Repo
# den doppelten macOS-Lauf pro Commit (macOS-Minuten zaehlen dort zehnfach).
on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/backend-ci.yml"

# Ein neuer Commit im PR bricht den noch laufenden Test des alten Commits ab. Auf main laeuft jeder Lauf zu Ende,
# denn jeder Merge liefert einen TestFlight-Build aus.
concurrency:
  group: ios-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Der GITHUB_TOKEN braucht nur Lesezugriff aufs Repo; Signierung, TestFlight und Deploy laufen ueber eigene Secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec fastlane test

  beta:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    # Immer nur ein Upload gleichzeitig: Zwei Läufe kurz hintereinander berechneten sonst dieselbe
    # TestFlight-Build-Nummer, und der zweite scheiterte mit "Redundant Binary Upload".
    concurrency:
      group: testflight-beta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Deploy to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane beta
