name: Backend Deploy

# Spielt das Backend nach einem grünen Backend-CI auf main automatisch auf den Server. Nur aktiv, wenn die Secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY und DEPLOY_KNOWN_HOSTS gesetzt sind; sonst endet der Job ohne Fehler.
# Auf dem Server erzwingt der Schlüssel in authorized_keys das Deploy-Skript (command="..."), er kann nichts anderes
# (Einrichtung: docs/backend-deploy.md, Abschnitt "Automatisch deployen").

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Ohne Secrets nichts tun
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Deploy-Secrets fehlen: automatisches Deployment ist aus."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auf dem Server deployen
        if: steps.check.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Der Befehl auf dem Server ist durch authorized_keys festgelegt; hier wird nur verbunden.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
